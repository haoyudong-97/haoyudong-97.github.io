name: Refresh Scholar metrics
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholar-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_scholar_metrics.py
      - name: Save updated snapshot
        run: |
          if git diff --quiet -- _data/scholar.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/scholar.json
          git commit -m 'Update Google Scholar metrics'
          git pull --rebase origin master
          git push origin HEAD:master
